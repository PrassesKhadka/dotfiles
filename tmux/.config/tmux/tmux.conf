# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Batman palette (WezTerm's Batman scheme: greys and yellow) under catppuccin's color names.
# The catppuccin plugin only sets @thm_* when unset (set -o), so these win and the status bar keeps its layout.
set -g @thm_bg "#1b1d1e"
set -g @thm_fg "#c6c5bf"
set -g @thm_rosewater "#fff78e"
set -g @thm_flamingo "#fff78e"
set -g @thm_pink "#fff78e"
set -g @thm_mauve "#fcef0c"
set -g @thm_red "#fcef0c"
set -g @thm_maroon "#f4fd22"
set -g @thm_peach "#e6dc44"
set -g @thm_yellow "#e6dc44"
set -g @thm_green "#c8be46"
set -g @thm_teal "#a3a3a6"
set -g @thm_sky "#a3a3a6"
set -g @thm_sapphire "#919495"
set -g @thm_blue "#fff78e"
set -g @thm_lavender "#dadbd6"
set -g @thm_subtext_1 "#a3a3a6"
set -g @thm_subtext_0 "#919495"
set -g @thm_overlay_2 "#9a9a9d"
set -g @thm_overlay_1 "#747271"
set -g @thm_overlay_0 "#737174"
set -g @thm_surface_2 "#62605f"
set -g @thm_surface_1 "#505354"
set -g @thm_surface_0 "#4d504c"
set -g @thm_mantle "#262829"
set -g @thm_crust "#1b1d1e"
# Let image protocols (kitty graphics/sixel) reach WezTerm, needed for images in nvim. Requires tmux >= 3.3
set -gq allow-passthrough on

# Keep long logs: lines of scrollback per pane (tmux owns the history, not WezTerm)
set -g history-limit 50000

# No delay after Esc (default 500ms makes nvim feel laggy inside tmux)
set -sg escape-time 10
set -g focus-events on

# Let tmux own the system clipboard (OSC 52 out to WezTerm; also works over ssh)
set -s set-clipboard on
set -ga terminal-features ",xterm-256color:clipboard"

set -g base-index 1
set -g pane-base-index 1

# Prefix/leader=Ctrl+b for tmux # REMEMBER release this prefix/leader before pressing other cmd's Eg: ctrl +b and release then c to create a new window
set-option -g prefix C-b
set-option -g prefix2 none

# Utility bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Unbind the defaults
unbind %
unbind '"'

# Bind | to vertical split (side-by-side)
bind '"' split-window -h -c "#{pane_current_path}"

# Bind - to horizontal split (top/bottom)
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# --- Move between panes with vim-style keys ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Resize panes with arrow keys ---
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Unbind default new-window binding
unbind c

# Bind prefix + c to prompt for a window name
bind c command-prompt -p "New window name:" "new-window -n '%%'"

# maximize panes
bind -r m resize-pane -Z

# Switch sessions with Alt+Left/Right
bind -n M-Left  switch-client -p   # Alt+Left
bind -n M-Right switch-client -n   # Alt+Right

# When the attached session is killed (or its last shell exits), stay in tmux and go back to "main" instead of
# closing the terminal. If main itself is gone, tmux picks another session; killing the last session still exits.
set -g detach-on-destroy off
set-hook -g session-closed 'if-shell "tmux has-session -t main" "switch-client -t main"'

# --- Fast cyclic window navigation with Alt+h / Alt+l ---
set -g wrap-search on         # allows wrap-around behavior

bind -n M-h previous-window
bind -n M-l next-window


# mouse support
set -g mouse on

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Instant switch to a new tmux session directory that exist
bind-key f display-popup -w 80% -h 70% -E "~/.local/bin/tmux-sessionizer" # fuzzy-pick a project and switch to its session
bind-key n command-prompt -p "New session name:" "new-session -s '%%'"
bind-key C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi" # yazi float
bind-key C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh" # quick floating terminal
bind-key C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit" # lazygit float
bind-key C-m display-popup -w 95% -h 95% -E "rmpc" # music float
bind d display-menu -T "#[align=centre]Config" -x C -y C \
    ".zshrc"            z  "display-popup -w 75% -h 75% -E 'nvim ~/dotfiles/zsh/.zshrc'" \
    ".zprofile"         p  "display-popup -w 75% -h 75% -E 'nvim ~/dotfiles/zsh/zprofile'" \
    ".tmux.conf"        t  "display-popup -w 75% -h 75% -E 'nvim ~/dotfiles/.config/tmux/tmux.conf'" \
    ".wezterm.lua"      w  "display-popup -w 75% -h 75% -E 'nvim ~/dotfiles/wezterm/.wezterm.lua'" \
    ".nvim"             n  "display-popup -d "~/dotfiles/nvim/.config/nvim" -E 'nvim ~/dotfiles/nvim/.config/nvim'" \
    "quit"              q  ""

# Drag copy using mouse: release copies to the system clipboard, selection stays visible
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -selection clipboard -i"
bind-key -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear "xclip -selection clipboard -i"
bind-key -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear "xclip -selection clipboard -i"

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin

# tmux-sessionx is a plugin for tmux that gives you a visual, interactive session manager inside tmux.
# It helps you create, switch, rename, and delete tmux sessions easily — all from a fuzzy finder interface (like fzf).
# Think of it as a “session dashboard” for tmux.
# keybinding: <prefix>s for sessions and w for windows
set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# tmux resurrect processes
set -g @resurrect-processes 'docker ssh psql mysql sqlite3 node npm yarn go mvn gradlew nvim rustc cargo rustup python python3 uvicorn fastapi'

# Configure Catppuccin (layout only; colors are the Batman @thm_* values at the top)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status bar refresh; every refresh re-runs the battery script, so don't go lower
set -g status-interval 5

# Status bar: "dot tabs" design, text only on the terminal background
#   main ~/dotfiles        ○ zsh  ● nvim  ○ logs            Sat 31 Oct  18:05  87%
set -g status-position top
set -g status-style "bg=default"
set -g status-justify absolute-centre

# left: session name (red block while the prefix is pressed), then the current directory
set -g status-left-length 60
set -g status-left "#{?client_prefix,#[bg=#{@thm_red}#,fg=#{@thm_bg}#,bold] #S ,#[fg=#{@thm_mauve}#,bold] #S }#[default] "
set -ga status-left "#[fg=#{@thm_subtext_0}]#{=/-32/...:#{s|$HOME|~|:pane_current_path}}  "

# windows: ○ inactive, ● active (+ zoom icon), gold on activity, red on bell
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-separator "  "
set -g window-status-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=default,fg=#{@thm_overlay_0}"
set -g window-status-activity-style "bg=default,fg=#{@thm_yellow}"
set -g window-status-bell-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-current-style "bg=default,fg=#{@thm_rosewater},bold"
set -g window-status-format "○ #W"
set -g window-status-current-format "● #W#{?window_zoomed_flag, 󰁌,}"

# right: caps lock (only while on), date, time, battery
# battery color comes from tmux-battery's charge tiers: grey >= 20%, yellow 6-19%, bright yellow <= 5%
set -g @batt_color_charge_primary_tier8 "#a3a3a6"
set -g @batt_color_charge_primary_tier7 "#a3a3a6"
set -g @batt_color_charge_primary_tier6 "#a3a3a6"
set -g @batt_color_charge_primary_tier5 "#a3a3a6"
set -g @batt_color_charge_primary_tier4 "#a3a3a6"
set -g @batt_color_charge_primary_tier3 "#a3a3a6"
set -g @batt_color_charge_primary_tier2 "#e6dc44"
set -g @batt_color_charge_primary_tier1 "#fcef0c"
# keep the terminal background (the plugin otherwise paints colour0 behind the text)
set -g @batt_color_charge_secondary_tier8 "default"
set -g @batt_color_charge_secondary_tier7 "default"
set -g @batt_color_charge_secondary_tier6 "default"
set -g @batt_color_charge_secondary_tier5 "default"
set -g @batt_color_charge_secondary_tier4 "default"
set -g @batt_color_charge_secondary_tier3 "default"
set -g @batt_color_charge_secondary_tier2 "default"
set -g @batt_color_charge_secondary_tier1 "default"
set -g @caps_indicator ""
run-shell -b "~/.config/tmux/caps.sh"
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{@caps_indicator},#[fg=#{@thm_bg}#,bg=#{@thm_yellow}#,bold] #{@caps_indicator} #[default]  ,}"
set -ga status-right "#[fg=#{@thm_subtext_0}]%a %d %b  #[fg=#{@thm_yellow}]%H:%M  "
set -ga status-right "#{battery_color_charge_fg}#{battery_percentage} "

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # keep plugin setup last; only overrides of plugin settings go below

# Prompts (new window/session, prefix :) and messages take the whole status bar: left-aligned and filling the line
# so the session, windows and date don't show around them. catppuccin sets these with align=centre when it
# loads, so they have to come after tpm.
set -g message-style "fg=#{@thm_yellow},bg=#{@thm_bg},fill=#{@thm_bg}"
set -g message-command-style "fg=#{@thm_yellow},bg=#{@thm_bg},fill=#{@thm_bg}"
