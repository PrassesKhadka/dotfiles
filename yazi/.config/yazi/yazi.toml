#:schema https://yazi-rs.github.io/schemas/yazi.json
# Only the settings that differ from yazi's defaults; see `yazi-config/preset/yazi-default.toml` upstream

[mgr]
# parent : current : preview
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
show_hidden    = true
linemode       = "size"
scrolloff      = 8

[preview]
wrap = "yes"
# Images and PDF pages are rendered at most this many pixels and never scaled up, so the default 600x900
# left them small in the pane; this fills it, maximized (T) too. Run `ya cache clear` after changing these
max_width  = 2000
max_height = 2800

[plugin]
# PDFs: built-in preview plus a "page / total" counter (plugins/pdf-page.yazi)
prepend_previewers = [
	{ mime = "application/pdf", run = "pdf-page" },
]
