# keyd: Caps Lock is Esc when tapped, Ctrl when held (every keyboard).
# keyd runs as root and reads /etc/keyd, so copy this there (README, Keyboard); don't symlink it,
# a config in your home could be edited without sudo and keyd can run commands as root.

[ids]

*

[main]

capslock = overload(control, esc)

[shift]

# Shift+Caps Lock is still a real Caps Lock (the LED and the tmux indicator keep working)
capslock = capslock
